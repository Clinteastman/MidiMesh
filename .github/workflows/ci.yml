name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test
        working-directory: tests/MidiMesh.Tests
        run: dotnet test

      - name: Build x64
        run: dotnet build src/MidiMesh -c Release -r win-x64 -p:Platform=x64

      - name: Build arm64
        run: dotnet build src/MidiMesh -c Release -r win-arm64 -p:Platform=ARM64
