name: Feature request
description: Suggest something MidiMesh could do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The problem you want solved, and your setup (which device into which).
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could MidiMesh help?
      description: Your idea for how it could work. Optional.
